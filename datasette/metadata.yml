databases:
  rivendell:
    title: Rivendell
    description: PocketBase media collection data
    tables:
      articles:
        title: Articles
        description: Saved articles with archive links
        facets:
          - creator
          - year
      podcasts:
        title: Podcasts
        facets:
          - creator
          - year
      videos:
        title: Videos
        facets:
          - creator
          - year
      books:
        title: Books
        facets:
          - author
          - year
      cds:
        title: CDs
        facets:
          - artist
          - year
      vinyls:
        title: Vinyls
        facets:
          - artist
          - year
      games:
        title: Games
        facets:
          - year
      movies:
        title: Movies
        facets:
          - director
          - year
      shows:
        title: Shows
        facets:
          - director
          - year
      meta:
        title: Meta (Tags/Genres/Platforms)
        facets:
          - type

    queries:
      articles_per_year:
        title: Articles per Year
        description: Count of articles grouped by year
        sql: |
          SELECT year, COUNT(*) as count
          FROM articles
          WHERE year IS NOT NULL AND year != 0
          GROUP BY year
          ORDER BY year DESC

      articles_top_creators:
        title: Top Article Creators
        description: Creators with most articles
        sql: |
          SELECT creator, COUNT(*) as count
          FROM articles
          GROUP BY creator
          ORDER BY count DESC
          LIMIT 50

      articles_repeat_creators:
        title: Repeat Creators (Articles)
        description: Creators who appear more than once
        sql: |
          SELECT creator, COUNT(*) as count
          FROM articles
          GROUP BY creator
          HAVING count > 1
          ORDER BY count DESC

      articles_by_domain:
        title: Articles by Domain
        description: Article count by base URL domain
        sql: |
          SELECT
            CASE
              WHEN url LIKE 'https://%' THEN
                SUBSTR(url, 9, INSTR(SUBSTR(url, 9), '/') - 1)
              WHEN url LIKE 'http://%' THEN
                SUBSTR(url, 8, INSTR(SUBSTR(url, 8), '/') - 1)
              ELSE url
            END as domain,
            COUNT(*) as count
          FROM articles
          GROUP BY domain
          ORDER BY count DESC
          LIMIT 50

      articles_tags:
        title: Article Tag Frequency
        description: How often each tag is used across articles
        sql: |
          SELECT je.value as tag, COUNT(*) as count
          FROM articles a, json_each(a.tags) je
          GROUP BY je.value
          ORDER BY count DESC

      articles_tags_by_year:
        title: Article Tags by Year
        description: Tag usage broken down by year
        sql: |
          SELECT je.value as tag, a.year, COUNT(*) as count
          FROM articles a, json_each(a.tags) je
          WHERE a.year IS NOT NULL AND a.year != 0
          GROUP BY je.value, a.year
          ORDER BY je.value, a.year DESC

      podcasts_per_year:
        title: Podcasts per Year
        sql: |
          SELECT year, COUNT(*) as count
          FROM podcasts
          WHERE year IS NOT NULL AND year != 0
          GROUP BY year
          ORDER BY year DESC

      podcasts_top_creators:
        title: Top Podcast Creators
        sql: |
          SELECT creator, COUNT(*) as count
          FROM podcasts
          GROUP BY creator
          ORDER BY count DESC
          LIMIT 50

      podcasts_tags:
        title: Podcast Tag Frequency
        sql: |
          SELECT je.value as tag, COUNT(*) as count
          FROM podcasts p, json_each(p.tags) je
          GROUP BY je.value
          ORDER BY count DESC

      videos_per_year:
        title: Videos per Year
        sql: |
          SELECT year, COUNT(*) as count
          FROM videos
          WHERE year IS NOT NULL AND year != 0
          GROUP BY year
          ORDER BY year DESC

      videos_top_creators:
        title: Top Video Creators
        sql: |
          SELECT creator, COUNT(*) as count
          FROM videos
          GROUP BY creator
          ORDER BY count DESC
          LIMIT 50

      videos_tags:
        title: Video Tag Frequency
        sql: |
          SELECT je.value as tag, COUNT(*) as count
          FROM videos v, json_each(v.tags) je
          GROUP BY je.value
          ORDER BY count DESC

      books_per_year:
        title: Books per Year
        sql: |
          SELECT year, COUNT(*) as count
          FROM books
          WHERE year IS NOT NULL AND year != 0
          GROUP BY year
          ORDER BY year DESC

      books_top_authors:
        title: Top Book Authors
        sql: |
          SELECT author, COUNT(*) as count
          FROM books
          GROUP BY author
          ORDER BY count DESC
          LIMIT 50

      games_per_year:
        title: Games per Year
        sql: |
          SELECT year, COUNT(*) as count
          FROM games
          WHERE year IS NOT NULL AND year != 0
          GROUP BY year
          ORDER BY year DESC

      games_by_platform:
        title: Games by Platform
        sql: |
          SELECT g.platform as platform, COUNT(*) as count
          FROM games g
          WHERE g.platform IS NOT NULL AND g.platform != ''
          GROUP BY g.platform
          ORDER BY count DESC

      games_by_status:
        title: Games by Status
        sql: |
          SELECT g.status as status, COUNT(*) as count
          FROM games g
          WHERE g.status IS NOT NULL AND g.status != ''
          GROUP BY g.status
          ORDER BY count DESC

      movies_per_year:
        title: Movies per Year
        sql: |

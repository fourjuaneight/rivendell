title: Rivendell Datasette
description: Pattern analysis for the Rivendell media collection
plugins:
  datasette-dashboards:
    rivendell-overview:
      title: Rivendell Overview
      description: Cross-collection patterns at a glance
      charts:
        collection-sizes:
          title: Collection Sizes
          db: rivendell
          query: |
            SELECT 'articles' as collection, COUNT(*) as count FROM articles
            UNION ALL SELECT 'podcasts', COUNT(*) FROM podcasts
            UNION ALL SELECT 'videos', COUNT(*) FROM videos
            UNION ALL SELECT 'books', COUNT(*) FROM books
            UNION ALL SELECT 'cds', COUNT(*) FROM cds
            UNION ALL SELECT 'games', COUNT(*) FROM games
            UNION ALL SELECT 'movies', COUNT(*) FROM movies
            UNION ALL SELECT 'shows', COUNT(*) FROM shows
            UNION ALL SELECT 'vinyls', COUNT(*) FROM vinyls
          library: vega-lite
          display:
            mark: bar
            encoding:
              x: {field: collection, type: nominal, sort: "-y"}
              y: {field: count, type: quantitative}
              color: {field: collection, type: nominal}

        all-media-by-year:
          title: All Media by Year
          db: rivendell
          query: |
            SELECT year, type, COUNT(*) as count FROM (
              SELECT year, 'articles' as type FROM articles WHERE year IS NOT NULL AND year != 0
              UNION ALL SELECT year, 'podcasts' FROM podcasts WHERE year IS NOT NULL AND year != 0
              UNION ALL SELECT year, 'videos' FROM videos WHERE year IS NOT NULL AND year != 0
              UNION ALL SELECT year, 'books' FROM books WHERE year IS NOT NULL AND year != 0
              UNION ALL SELECT year, 'cds' FROM cds WHERE year IS NOT NULL AND year != 0
              UNION ALL SELECT year, 'games' FROM games WHERE year IS NOT NULL AND year != 0
              UNION ALL SELECT year, 'movies' FROM movies WHERE year IS NOT NULL AND year != 0
              UNION ALL SELECT year, 'shows' FROM shows WHERE year IS NOT NULL AND year != 0
              UNION ALL SELECT year, 'vinyls' FROM vinyls WHERE year IS NOT NULL AND year != 0
            )
            GROUP BY year, type
            ORDER BY year
          library: vega-lite
          display:
            mark: bar
            encoding:
              x: {field: year, type: ordinal}
              y: {field: count, type: quantitative}
              color: {field: type, type: nominal}

        favorites-by-collection:
          title: Favorites by Collection
          db: rivendell
          query: |
            SELECT 'articles' as collection, COUNT(*) as count FROM articles WHERE favorite = 1
            UNION ALL SELECT 'podcasts', COUNT(*) FROM podcasts WHERE favorite = 1
            UNION ALL SELECT 'videos', COUNT(*) FROM videos WHERE favorite = 1
            UNION ALL SELECT 'books', COUNT(*) FROM books WHERE favorite = 1
            UNION ALL SELECT 'games', COUNT(*) FROM games WHERE favorite = 1
            UNION ALL SELECT 'movies', COUNT(*) FROM movies WHERE favorite = 1
            UNION ALL SELECT 'shows', COUNT(*) FROM shows WHERE favorite = 1
          library: vega-lite
          display:
            mark: bar
            encoding:
              x: {field: collection, type: nominal, sort: "-y"}
              y: {field: count, type: quantitative}
              color: {field: collection, type: nominal}

    articles-dashboard:
      title: Articles
      description: Article patterns by year, creator, tag, and domain
      charts:
        articles-by-year:
          title: Articles by Year
          db: rivendell
          query: |
            SELECT year, COUNT(*) as count
            FROM articles
            WHERE year IS NOT NULL AND year != 0
            GROUP BY year
            ORDER BY year
          library: vega-lite
          display:
            mark: line
            encoding:
              x: {field: year, type: ordinal}
              y: {field: count, type: quantitative}

        articles-top-creators:
          title: Top 10 Creators
          db: rivendell
          query: |
            SELECT creator, COUNT(*) as count
            FROM articles
            GROUP BY creator
            ORDER BY count DESC
            LIMIT 10
          library: vega-lite
          display:
            mark: bar
            encoding:
              x: {field: count, type: quantitative}
              y: {field: creator, type: nominal, sort: "-x"}

        articles-top-tags:
          title: Top 15 Tags
          db: rivendell
          query: |
            SELECT je.value as tag, COUNT(*) as count
            FROM articles a, json_each(a.tags) je
            GROUP BY je.value
            ORDER BY count DESC
            LIMIT 15
          library: vega-lite
          display:
            mark: bar
            encoding:
              x: {field: count, type: quantitative}
              y: {field: tag, type: nominal, sort: "-x"}

        articles-top-domains:
          title: Top 10 Domains
          db: rivendell
          query: |
            SELECT
              CASE
                WHEN url LIKE 'https://%' THEN
                  SUBSTR(url, 9, INSTR(SUBSTR(url, 9), '/') - 1)
                WHEN url LIKE 'http://%' THEN
                  SUBSTR(url, 8, INSTR(SUBSTR(url, 8), '/') - 1)
                ELSE url
              END as domain,
              COUNT(*) as count
            FROM articles
            GROUP BY domain
            ORDER BY count DESC
            LIMIT 10
          library: vega-lite
          display:
            mark: bar
            encoding:
              x: {field: count, type: quantitative}
              y: {field: domain, type: nominal, sort: "-x"}


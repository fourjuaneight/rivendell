      favorites_by_collection:
        title: Favorites by Collection
        description: Count of favorited records per collection
        sql: |
          SELECT 'articles' as collection, COUNT(*) as count FROM articles WHERE favorite = 1
          UNION ALL SELECT 'podcasts', COUNT(*) FROM podcasts WHERE favorite = 1
          UNION ALL SELECT 'videos', COUNT(*) FROM videos WHERE favorite = 1
          UNION ALL SELECT 'books', COUNT(*) FROM books WHERE favorite = 1
          UNION ALL SELECT 'games', COUNT(*) FROM games WHERE favorite = 1
          UNION ALL SELECT 'movies', COUNT(*) FROM movies WHERE favorite = 1
          UNION ALL SELECT 'shows', COUNT(*) FROM shows WHERE favorite = 1
          ORDER BY count DESC

      collection_totals:
        title: Collection Totals
        description: Record count per collection
        sql: |
          SELECT 'articles' as collection, COUNT(*) as count FROM articles
          UNION ALL SELECT 'podcasts', COUNT(*) FROM podcasts
          UNION ALL SELECT 'videos', COUNT(*) FROM videos
          UNION ALL SELECT 'books', COUNT(*) FROM books
          UNION ALL SELECT 'cds', COUNT(*) FROM cds
          UNION ALL SELECT 'games', COUNT(*) FROM games
          UNION ALL SELECT 'movies', COUNT(*) FROM movies
          UNION ALL SELECT 'shows', COUNT(*) FROM shows
          UNION ALL SELECT 'vinyls', COUNT(*) FROM vinyls
          UNION ALL SELECT 'github', COUNT(*) FROM github
          UNION ALL SELECT 'feeds', COUNT(*) FROM feeds
          ORDER BY count DESC

      all_media_by_year:
        title: All Media by Year
        description: Combined count across all media types per year
        sql: |
          SELECT year, type, COUNT(*) as count FROM (
            SELECT year, 'articles' as type FROM articles WHERE year IS NOT NULL AND year != 0
            UNION ALL SELECT year, 'podcasts' FROM podcasts WHERE year IS NOT NULL AND year != 0
            UNION ALL SELECT year, 'videos' FROM videos WHERE year IS NOT NULL AND year != 0
            UNION ALL SELECT year, 'books' FROM books WHERE year IS NOT NULL AND year != 0
            UNION ALL SELECT year, 'cds' FROM cds WHERE year IS NOT NULL AND year != 0
            UNION ALL SELECT year, 'games' FROM games WHERE year IS NOT NULL AND year != 0
            UNION ALL SELECT year, 'movies' FROM movies WHERE year IS NOT NULL AND year != 0
            UNION ALL SELECT year, 'shows' FROM shows WHERE year IS NOT NULL AND year != 0
            UNION ALL SELECT year, 'vinyls' FROM vinyls WHERE year IS NOT NULL AND year != 0
          )
          GROUP BY year, type
          ORDER BY year DESC, type
